<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <title>Movies</title>
</head>
<body>
     <header class="navbar">
    <div class="logo">MovieFinder</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Movies</a>
        <a href="#">Genres</a>
        <a href="#">About</a>
    </nav>
</header>
<section class="hero__search">
    <div class="hero__content--search">
        <h1>Looking for something Else?</h1>
        <form class="search-form">
            <input type="text" placeholder="Search for a movie..." onchange="onSearch(event)">
            <button type="submit"> Search </button>
        </form>
    </div> 
</section>
<main class="container"> 
    <div class="section-heading">
        <h2>Popular Movies</h2>
        <button class="filter-button"> Filter </button>
    </div>

    <section class="movie-grid">
        <div class="movie-card">
            <div class="movie-poster">
                <img src="" alt="Movie poster placeholder" >
            </div>
            
            <div class="movie-info">
                <h3>Movie Title</h3>
                <p class="movie-year">2026</p>
                <div class="movie-details">
                    <span>imdbID</span>
                </div>
                <button class="details-button"> View Details </button>
            </div>
        </div>
    </section>
    </main>
</body>
</html>
