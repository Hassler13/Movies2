<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/05828249d2.js" crossorigin="anonymous"></script>
    <script src="index.js" defer></script>
    <title>Movies</title>
</head>
<body>
     <header class="navbar">
    <div class="logo">MovieFinder</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Movies</a>
        <a href="#">Genres</a>
        <a href="#footer">About</a>
    </nav>
</header>
<section class="hero">
    <div class="hero-content">
        <h1>Find Your Next Movie</h1>
        <p> Search for movies, discover new favorites, and explore what's worth watching. </p>
        <form class="search-form">
            <input type="text" placeholder="Search for a movie...">
            <button type="submit" onclick="onSearch(event)" autocomplete="off"> Search </button>
        </form>
    </div> 
</section>
<main class="container"> 
    <div class="section-heading">
        <h2>Popular Movies</h2>
        <select id="filter" class="filter-button" onchange="filterMovies(event)">
            <option value="" disabled selected>Filter</option>
            <option value="A_Z">A - Z</option>
            <option value="Z_A">Z - A</option>
        </select>
    </div>

        <div class="loading__text">loading...</div>

    <section class="movie-grid">
        <div class="movie-card">
            <div class="movie-poster">
                <img src="" alt="Movie poster placeholder" >
            </div>
            
            <div class="movie-info">
                <h3>Movie Title</h3>
                <p class="movie-year">2026</p>
                <div class="movie-details">
                    <span>imdbID</span>
                </div>
                <button class="details-button"> View Details </button>
            </div>
        </div>
    </section>
    </main>
    <footer class="footer">
        <p>&copy; 2023 MovieFinder. All rights reserved.</p>
    </footer>
</body>
</html>
